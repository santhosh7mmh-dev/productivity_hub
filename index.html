<!doctype html>
<html lang="en" data-theme="dark" data-fontsize="md" data-sidebar="expanded">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub — Personal Productivity Workspace</title>
<meta name="description" content="A local-first personal productivity hub: notes, QR tools, clipboard manager, and AI chat, all offline-capable and stored on your device.">
<meta name="theme-color" content="#0a0c12">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>

<!-- Ambient background layers (Module 5). Pure decoration, no content. -->
<div class="bg-effects" aria-hidden="true">
  <div class="bg-aurora"><span></span><span></span><span></span></div>
</div>
<div class="cursor-spotlight" id="cursorSpotlight" aria-hidden="true"></div>

<!-- Mobile-only topbar -->
<header class="topbar">
  <div class="topbar-brand">
    <img src="icons/icon-192.png" alt="">
    <span>Hub</span>
  </div>
  <button class="topbar-search-btn" id="topbarSearchBtn" aria-label="Search" data-tooltip="Search (Ctrl+K)">🔍</button>
</header>

<div id="app" data-sidebar="expanded">
  <!-- js/components/sidebar.js renders into this node -->
  <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>

  <main class="app-main">
    <!-- js/router.js swaps the contents of this node per-route -->
    <div class="app-view" id="appView" role="main"></div>
  </main>
</div>

<!-- Toast stack -->
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

<!-- Generic confirm/alert modal (js/components/modal.js) -->
<div class="modal-overlay" id="modalRoot">
  <div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<!-- Command palette (Ctrl+/) -->
<div class="cmdk-overlay" id="cmdkOverlay">
  <div class="cmdk-box" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmdk-input-row">
      <span class="ci-icon">⌘</span>
      <input type="text" class="cmdk-input" id="cmdkInput" placeholder="Type a command…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-footer">
      <span class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span class="kbd-hint"><kbd>Enter</kbd> select</span>
      <span class="kbd-hint"><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- Global search (Ctrl+K) — visually identical shell, separate instance/state -->
<div class="cmdk-overlay" id="searchOverlay">
  <div class="cmdk-box" role="dialog" aria-modal="true" aria-label="Global search">
    <div class="cmdk-input-row">
      <span class="ci-icon">🔍</span>
      <input type="text" class="cmdk-input" id="searchInput" placeholder="Search notes, clipboard, AI chats…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="cmdk-results" id="searchResults"></div>
    <div class="cmdk-footer">
      <span class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span class="kbd-hint"><kbd>Enter</kbd> open</span>
      <span class="kbd-hint"><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- Context menu (single reusable instance, repositioned per use) -->
<div class="context-menu" id="contextMenu" role="menu"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
